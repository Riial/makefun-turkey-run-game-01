<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOWL PLAY — a turkey escape game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1a12; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { width: min(100vw, 160vh); height: auto; aspect-ratio: 8 / 5; display: block; background: #f7b267; touch-action: none; cursor: pointer; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800" aria-label="FOWL PLAY: a turkey escapes the farmer, dodges ovens and carving knives"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./main.js"></script>
</body>
</html>
